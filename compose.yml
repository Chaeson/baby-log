services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: twinlog
      POSTGRES_USER: twinlog
      POSTGRES_PASSWORD: local-twinlog-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - twinlog-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twinlog -d twinlog"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    mem_limit: 1g
    cpus: 0.25
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/twinlog
      DB_USERNAME: twinlog
      DB_PASSWORD: local-twinlog-password
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 5

volumes:
  twinlog-postgres:
